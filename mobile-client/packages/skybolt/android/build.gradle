buildscript {
  ext.Skybolt = [
    kotlinVersion: "2.1.20",
    minSdkVersion: 24,
    compileSdkVersion: 36,
    targetSdkVersion: 36,
    ndkVersion: "27.1.12297006"
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return Skybolt[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
    classpath "org.jetbrains.kotlin:kotlin-serialization:${getExtOrDefault('kotlinVersion')}"
    classpath "com.google.protobuf:protobuf-gradle-plugin:0.9.5"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "org.jetbrains.kotlin.plugin.serialization"
apply plugin: "com.google.protobuf"

apply plugin: "com.facebook.react"

react {
  jsRootDir = file("../src")
  libraryName = "NativeSkyboltSpec"
  codegenJavaPackageName = "com.skybolt"
}

android {
  namespace "com.skybolt"

  compileSdkVersion getExtOrDefault("compileSdkVersion")
  ndkVersion getExtOrDefault("ndkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    targetSdkVersion getExtOrDefault("targetSdkVersion")
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    debug {
      buildConfigField "boolean", "ALLOW_HTTP_IN_DEV", "true"
    }
    release {
      minifyEnabled false
      buildConfigField "boolean", "ALLOW_HTTP_IN_DEV", "false"
    }
  }

  lint {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      proto.srcDir "src/main/proto"
    }
  }

  packaging {
    resources {
      excludes += "META-INF/versions/9/OSGI-INF/MANIFEST.MF"
    }
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "androidx.work:work-runtime-ktx:2.11.0"
  implementation "androidx.datastore:datastore-preferences:1.1.7"
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
  implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"
  implementation "com.google.protobuf:protobuf-javalite:4.33.0"
  implementation "com.google.protobuf:protobuf-kotlin-lite:4.33.0"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
  implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"
  implementation "com.google.crypto.tink:tink-android:1.19.0"

  testImplementation "junit:junit:4.13.2"
  testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"
  testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
  testImplementation "org.robolectric:robolectric:4.13"
  testImplementation "androidx.test:core:1.6.1"

  androidTestImplementation "androidx.test.ext:junit:1.2.1"
  androidTestImplementation "androidx.test:runner:1.6.2"
  androidTestImplementation "androidx.test:core:1.6.1"
  androidTestImplementation "androidx.work:work-testing:2.11.0"
  androidTestImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
}

protobuf {
  protoc {
    artifact = "com.google.protobuf:protoc:4.32.1"
  }
  generateProtoTasks {
    all().configureEach { task ->
      builtins {
        java { option "lite" }
        kotlin { option "lite" }
      }
    }
  }
}
